name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zipi aç
        run: unzip -q YvokYoxla.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Lisenziyalar
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: APK yarat
        working-directory: YvokYoxla
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: YvokYoxla-apk
          path: YvokYoxla/app/build/outputs/apk/debug/*.apk
          
