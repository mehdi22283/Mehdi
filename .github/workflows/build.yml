name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MehdiKeyMapper-XiaomiTVBox2-v2.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q MehdiKeyMapper-XiaomiTVBox2-v2.zip -d project

      - name: Find Android project
        run: |
          find project -name gradlew -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: |
          chmod +x $(find project -name gradlew | head -1)

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MehdiKeyMapper-APK
          path: "project/**/*.apk"
