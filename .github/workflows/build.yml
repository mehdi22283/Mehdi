name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip-i aç
        run: unzip -q VideoyaBax.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: APK yığ
        run: gradle assembleDebug
        working-directory: VideoyaBax
      - uses: actions/upload-artifact@v4
        with:
          name: Videoya-bax
          path: VideoyaBax/app/build/outputs/apk/debug/Videoya-bax.apk
