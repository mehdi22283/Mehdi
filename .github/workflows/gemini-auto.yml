name: Gemini Auto Code Generator

on:
  issues:
    types: [opened, labeled]

jobs:
  generate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google GenAI SDK
        run: pip install google-generativeai

      - name: Generate Content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -c "
          import os, google.generativeai as genai
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          model = genai.GenerativeModel('gemini-1.5-flash')
          response = model.generate_content(f'Create code/files based on this request: {os.environ[\"ISSUE_BODY\"]}')
          with open('generated_output.txt', 'w') as f:
              f.write(response.text)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "gemini-bot@users.noreply.github.com"
          git add .
          git commit -m "auto: generated content via Gemini" || exit 0
          git push
          
