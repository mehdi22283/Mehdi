<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qiymət Hesablama - AMOLED Qara Tema</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF7F;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 450px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }
        h2, h3 {
            color: #00CED1;
            text-align: center;
        }
        label {
            margin-top: 15px;
            font-weight: 600;
            color: #00FF7F;
            display: block;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background-color: #121212;
            border: 1px solid #00CED1;
            border-radius: 6px;
            font-size: 16px;
            color: #00FF7F;
            caret-color: #00CED1;
            transition: border-color 0.3s ease;
        }
        input::placeholder {
            color: #005f3f;
        }
        input:focus {
            outline: none;
            border-color: #00FF7F;
            box-shadow: 0 0 8px #00FF7F;
            background-color: #001f00;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #00CED1;
            color: #000;
            font-weight: 700;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background: #00B2AA;
        }
        #netice {
            margin-top: 25px;
            text-align: center;
            font-weight: 700;
            font-size: 20px;
            color: #00FF7F;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <h2>Qiymət Hesablama</h2>

    <label for="qiymet">Malın qiyməti (Manat və Qəpik):</label>
    <input type="tel" id="qiymet" placeholder="Məsələn: 10.50" oninput="hesabla()" autocomplete="off" />

    <label for="ceki">Malın çəkisi (Kiloqram və Qram):</label>
    <input type="tel" id="ceki" placeholder="Məsələn: 2.500" oninput="hesabla()" autocomplete="off" />

    <h3>Digər mal üçün hesablama:</h3>

    <label for="dig_qiymet">Digər malın qiyməti (Manat və Qəpik):</label>
    <input type="tel" id="dig_qiymet" placeholder="Məsələn: 15.75" oninput="hesabla()" autocomplete="off" />

    <label for="dig_ceki">Digər malın çəkisi (Kiloqram və Qram):</label>
    <input type="tel" id="dig_ceki" placeholder="Məsələn: 1.200" oninput="hesabla()" autocomplete="off" />

    <div id="netice"></div>

    <script>
        function hesabla() {
            const qiymet_str = document.getElementById("qiymet").value.split(".");
            const qiymet = (parseFloat(qiymet_str[0]) || 0) + ((parseFloat(qiymet_str[1]) || 0) / 100);

            const ceki_str = document.getElementById("ceki").value.split(".");
            const ceki = (parseFloat(ceki_str[0]) || 0) * 1000 + (parseFloat(ceki_str[1]) || 0);

            const dig_ceki_str = document.getElementById("dig_ceki").value.split(".");
            const dig_ceki = (parseFloat(dig_ceki_str[0]) || 0) * 1000 + (parseFloat(dig_ceki_str[1]) || 0);

            const dig_qiymet_str = document.getElementById("dig_qiymet").value.split(".");
            const dig_qiymet = (parseFloat(dig_qiymet_str[0]) || 0) + ((parseFloat(dig_qiymet_str[1]) || 0) / 100);

            let netice = "";

            if (ceki > 0 && qiymet > 0) {
                if (dig_ceki > 0) {
                    const yeni_qiymet = (dig_ceki * qiymet) / ceki;
                    netice = `${yeni_qiymet.toFixed(2)} manat`;
                } else if (dig_qiymet > 0) {
                    const yeni_ceki = (dig_qiymet * ceki) / qiymet;
                    netice = `${(yeni_ceki / 1000).toFixed(3)} kiloqram`;
                } else {
                    netice = "Zəhmət olmasa digər mal üçün qiymət və ya çəki daxil edin!";
                }
            } else {
                netice = "Əsas malın qiyməti və çəkisi daxil edilməlidir!";
            }

            document.getElementById("netice").textContent = netice;
        }
    </script>
</body>
</html>
