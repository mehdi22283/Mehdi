name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q MehdiKeyMapper-XiaomiTVBox2-v2.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: extracted/MehdiKeyMapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradle executable
        working-directory: extracted/MehdiKeyMapper
        run: chmod +x gradlew

      - name: Build APK
        working-directory: extracted/MehdiKeyMapper
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MehdiKeyMapper-APK
          path: extracted/MehdiKeyMapper/app/build/outputs/apk/debug/*.apk
