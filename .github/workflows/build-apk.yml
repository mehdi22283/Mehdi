name: APK yığ
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          # Repodakı zip faylını cari qovluğa çıxarır
          unzip -o "*.zip"
          
          # Əgər zip faylı daxilindəki fayllar alt qovluqdadırsa (məsələn: M3USinayici/), onları kök qovluğa köçürür:
          if [ -d "M3USinayici" ]; then
            cp -rn M3USinayici/* . 2>/dev/null || true
            cp -rn M3USinayici/.* . 2>/dev/null || true
          fi
          
          # gradlew faylına icra etmə icazəsi verir
          chmod +x gradlew || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: assembleDebug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Sinayici-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
