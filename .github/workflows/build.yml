name: Build APK from ZIP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q QiymetApp.zip -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build APK
        run: gradle assembleRelease
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: Qiymet-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
