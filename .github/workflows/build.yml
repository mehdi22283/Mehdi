name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip
        run: unzip -q KeyMapperTV.zip

      - name: Build
        working-directory: KeyMapperTV
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "=== ERRORS ==="
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -80
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: KeyMapperTV/build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KeyMapperTV-apk
          path: KeyMapperTV/app/build/outputs/apk/debug/app-debug.apk
