name: Build APK from ZIP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP-i runner daxilində aç
        run: |
          mkdir -p /tmp/proj
          for z in *.zip; do unzip -q -o "$z" -d /tmp/proj; done
          S=$(find /tmp/proj \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK qur
        run: cd "$PROJ" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          
