<!DOCTYPE html>
<html>
<head>
  <title>ARB TV - AAC Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background:#000; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
  <video id="video" controls autoplay style="width:100%; max-width:800px;"></video>
  <script>
    var video = document.getElementById('video');
    var videoSrc = 'http://46.32.176.50/arb/tracks-v1a1/mono.ts.m3u8';
    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
    }
  </script>
</body>
</html>
