name: APK yığ

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip-i aç
        run: |
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Zip: $ZIP"
          mkdir -p src_project
          unzip -q "$ZIP" -d src_project
          GRADLE_FILE=$(find src_project -name settings.gradle | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Layihə qovluğu: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK yığ
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: APK-nı hazırla
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" M3USinayici.apk
          ls -la M3USinayici.apk

      - name: Releases-ə yüklə
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: M3U Sınayıcı v${{ github.run_number }}
          files: M3USinayici.apk

      - name: Artifact kimi də saxla
        uses: actions/upload-artifact@v4
        with:
          name: M3USinayici-apk
          path: M3USinayici.apk
