name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zipi aç
        run: unzip -q TVOpen.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK yığ
        working-directory: TVOpen
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TVOpen-apk
          path: TVOpen/app/build/outputs/apk/debug/app-debug.apk
