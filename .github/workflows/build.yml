name: APK yığ və Release-də göstər

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK yığ
        run: gradle assembleDebug --no-daemon

      - name: APK adını düzəlt
        run: cp app/build/outputs/apk/debug/app-debug.apk M3USinayici.apk

      - name: Release yarat və APK-nı əlavə et
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: M3U Sınayıcı v${{ github.run_number }}
          files: M3USinayici.apk
          make_latest: true
